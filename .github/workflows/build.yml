name: build

# 每次 push 到 main / 每个 PR：编译并上传可下载的产物（Artifacts）
# 推送 v* 标签：自动创建 Release 并把产物挂上去
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # 创建 Release 需要
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 编译 KeyGlass（win-x64）
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 显示环境
        shell: pwsh
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: 编译（自包含文件夹版，免安装 .NET）
        shell: pwsh
        run: |
          dotnet publish src/KeyGlass/KeyGlass.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -p:DebugType=None -p:DebugSymbols=false `
            -o out --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish 失败（exit $LASTEXITCODE）" }

      - name: 打包 zip
        shell: pwsh
        run: |
          $ref = ('${{ github.ref_name }}').Replace('/', '-')
          $name = "KeyGlass-$ref-win-x64.zip"
          Compress-Archive -Path out\* -DestinationPath $name -CompressionLevel Optimal
          if (-not (Test-Path $name)) { throw "打包失败" }
          $size = [math]::Round((Get-Item $name).Length / 1MB, 1)
          "产物：$name（$size MB）"
          @(
            "### 构建产物"
            ""
            "- 文件：``$name``"
            "- 大小：**$size MB**"
            "- 提交：${{ github.sha }}"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 上传 Artifact（每次提交都能下载）
        uses: actions/upload-artifact@v4
        with:
          name: KeyGlass-win-x64
          path: KeyGlass-*-win-x64.zip
          retention-days: 14
          if-no-files-found: error

      - name: 创建 / 更新 Release（仅 v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KeyGlass-*-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
